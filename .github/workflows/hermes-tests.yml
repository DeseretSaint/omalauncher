name: fork tests

# Upstream's ci.yml only runs on main and on pull_request; a pull request from a
# fork waits for a maintainer to approve its workflows, so run the same checks
# here on the fork's own branch.
on:
  workflow_dispatch:
  push:
    branches: [fork/hermes-build]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew :owl:test :app:testDebugUnitTest :owl:owlJar
