name: fork apk

# Builds a sideloadable APK for this fork. Upstream's release workflow writes the
# Play upload key, which a fork does not have; without keystore.properties the
# release build falls back to the debug key (see app/build.gradle.kts).
on:
  workflow_dispatch:
  push:
    branches: [fork/hermes-build]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch proot
        run: |
          sudo -S -p '' apt-get update -q && sudo -S -p '' apt-get install -yq libarchive-tools
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          [ -d "$ANDROID_HOME/ndk/$ndk" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null
          scripts/fetch-proot.sh

      - name: Build
        run: ./gradlew :app:assembleRelease

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk omalauncher-hermes-fork.apk

      - uses: actions/upload-artifact@v4
        with:
          name: omalauncher-hermes-apk
          path: omalauncher-hermes-fork.apk
          if-no-files-found: error
